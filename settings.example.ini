; ---------------------------------------------------------------------------
; Beijer.bot settings
;
; Copy this file to  settings.ini  and fill in your own keys.
; settings.ini is gitignored, so your keys never enter the repository.
; ---------------------------------------------------------------------------

[Hotkeys]
; AutoHotkey v2 syntax:  ^ = Ctrl   ! = Alt   + = Shift   # = Windows key
; Leave a value empty to switch that hotkey off entirely.
;
; A note on the default backtick (`): on US-International — a common layout
; if you type Dutch, French or German — it is a DEAD KEY, waiting to compose
; à/è/ù, so claiming it here will break accented typing. On UK and other ISO
; layouts it sits in a different place again. If either applies to you, pick
; something else: #space and ^!space are good, rarely-taken choices.

Menu=`
MenuCentred=^`
Clipboard=^!c
LibraryEditor=
GoogleSearch=^/
DesktopSearch=^+d
Reload=^r

[AI]
; Which provider to use: anthropic or openai
Provider=anthropic

; Leave blank to use the provider's default model
; (anthropic: claude-opus-5, openai: gpt-5)
Model=

; Ceiling on the reply length. Required by the Anthropic API.
MaxTokens=16000

; How hard the model thinks before answering: low, medium, high, xhigh, max.
; Anthropic only. Lower is faster and cheaper, which suits short lookups;
; raise it for work where the answer's quality matters more than the wait.
Effort=medium

[Keys]
; Only the engines you actually use need a key. Easiest filled in from
; Settings > "AI providers & keys...", which also lists each provider's
; models. Nothing here is required to get started: MyMemory translates
; without a key at all.
anthropic=
openai=
gemini=
mistral=
deepseek=
openrouter=
deepl=
google=
microsoft=
modernmt=
; Ollama and a custom endpoint usually need no key; set one only if yours
; sits behind a gateway that wants one.
ollama=
custom=

[Clipboard]
; 1 = record clipboard history, 0 = paused.
; Toggle at any time from the menu. Note this is read once at startup, so
; changing it does not reach an instance that is already running — use the
; menu for that, or drop a data\capture.paused file, which the watcher checks
; on every copy and ignores once it is more than ten minutes old.
Enabled=1

; How many entries to keep. Oldest fall off the end.
MaxItems=200

; How many recent clips to list directly on the main menu, under
; "Recent clips". The full history is always in the window (Ctrl+Alt+C).
MenuEntries=12

; Discard entries older than this many minutes. 0 = keep until deleted.
AutoDeleteMinutes=0

; Never record anything copied while one of these apps is in the foreground.
; Pipe-separated process names. Empty by default: if you copy a URL out of
; your password manager and it silently vanished, you'd rightly call that
; broken — so this is opt-in. A sensible list to paste in:
;
; keepass.exe|keepassxc.exe|1password.exe|bitwarden.exe|dashlane.exe|
; lastpass.exe|nordpass.exe|protonpass.exe|enpass.exe|keeper.exe
ExcludedApps=

[QuickTrans]
; Which engines to ask. 0 switches one off. Easier from Settings >
; "AI providers & keys...", which writes this section for you.
;
; MyMemory needs no key and works out of the box; the rest read their key
; from [Keys] above and are skipped silently when it is missing.
mymemory=1
google=1
microsoft=1
modernmt=1
deepl=1
anthropic=1
openai=1
gemini=1
mistral=1
deepseek=1
openrouter=1
ollama=1
custom=1

; Ask the AI engines automatically with every translation. Set to 0 and they
; wait for Ctrl+Shift+Enter instead: the machine-translation engines answer
; straight away and for nothing, and you only pay for an LLM when you decide
; the free answers were not good enough. Worth turning off once you have
; several LLMs enabled, since otherwise every selection queries all of them.
AutoFetchAI=1

; Which model each AI engine should use. Leave blank for the provider's
; default (claude-opus-5, gpt-5, gemini-2.5-flash, mistral-small-latest,
; deepseek-chat, anthropic/claude-sonnet-5 via OpenRouter, llama3.1).
;
; Don't guess the names: the Models button beside each engine in Settings >
; "AI providers & keys..." asks that provider what YOUR key can actually
; use and fills the dropdown, since availability differs by account.
;
; For one-sentence translation the small models are the sensible choice -
; as good as the flagship at this job, several times faster and far cheaper,
; and you are paying several engines at once:
;   anthropic_model=claude-haiku-4-5
;   openai_model=gpt-5-mini
;   gemini_model=gemini-2.5-flash
anthropic_model=
openai_model=
gemini_model=
mistral_model=
deepseek_model=
openrouter_model=
ollama_model=
custom_model=

; Where the local and custom endpoints live. Both must speak the OpenAI
; chat-completions dialect, which most local servers do. Ollama defaults to
; http://localhost:11434/v1 when this is blank; a custom endpoint stays
; switched off until you give it a URL, and needs a model name too since
; there is no sensible default to guess.
ollama_url=
custom_url=

; Most custom endpoints are MT proxies rather than instruction-following
; models: they translate whatever you send, so a wrapped prompt comes back
; with the instructions translated too. 1 sends the bare text with the
; language direction in the system message. Set to 0 if yours really is an
; LLM and handles a full prompt.
custom_raw=1

; Azure Translator ties a key to a region. "global" resources are the common
; case and the default; a region-locked one wants its own name here, e.g.
; westeurope.
microsoft_region=

; Defaults for the language pair; both are changeable in the window.
SourceLang=Dutch
TargetLang=English

; The LLM engines are asked for one short answer, so they are kept cheap.
MaxTokens=1000
Effort=low

[Window]
; Written automatically when you resize or move the main window; delete these
; to go back to the default size.
X=
Y=
W=
H=
